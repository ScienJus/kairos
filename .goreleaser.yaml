version: 2

project_name: kairos

builds:
  - id: kairos-server
    main: ./cmd/kairos-server
    binary: kairos-server
    tags:
      - webdist
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md
      - src: .release/THIRD_PARTY_NOTICES.txt
        strip_parent: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - disable: true

changelog:
  disable: true
