version: 2

project_name: kairos

before:
  hooks:
    - npm --prefix web ci
    - npm --prefix web run build

builds:
  - id: kairos-server
    main: ./cmd/kairos-server
    binary: kairos-server
    tags:
      - webdist
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - README.zh-CN.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: github-native

release:
  prerelease: auto
