name: Feature request
description: Propose a focused improvement to Kairos
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or limitation that motivates this request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain observable behavior rather than only an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Domain or application behavior
        - HTTP API
        - MCP or agent integration
        - Operations console
        - Persistence or deployment
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This request keeps model selection and sandbox execution outside Kairos.
          required: true
