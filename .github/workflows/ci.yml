name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairos
          POSTGRES_PASSWORD: kairos
          POSTGRES_DB: kairos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kairos -d kairos_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KAIROS_TEST_POSTGRES_DSN: postgres://kairos:kairos@127.0.0.1:5432/kairos_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Smoke-test server with PostgreSQL
        env:
          KAIROS_POSTGRES_DSN: ${{ env.KAIROS_TEST_POSTGRES_DSN }}
          KAIROS_LISTEN_ADDR: 127.0.0.1:18081
          KAIROS_ARTIFACT_DIR: ${{ runner.temp }}/kairos-postgres-artifacts
        run: |
          go build -o "${RUNNER_TEMP}/kairos-server" ./cmd/kairos-server
          "${RUNNER_TEMP}/kairos-server" >"${RUNNER_TEMP}/kairos-postgres.log" 2>&1 &
          kairos_server_pid=$!
          trap 'kill "${kairos_server_pid}" 2>/dev/null || true; wait "${kairos_server_pid}" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18081/healthz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "${kairos_server_pid}" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/kairos-postgres.log"
          exit 1

  frontend:
    name: Frontend and embedded server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -tags webdist ./web
      - run: go build -tags webdist -o bin/kairos-server ./cmd/kairos-server
      - name: Smoke-test the quickstart
        run: KAIROS_QUICKSTART_SMOKE_TEST=1 KAIROS_QUICKSTART_ADDR=127.0.0.1:18080 ./examples/quickstart/run.sh
