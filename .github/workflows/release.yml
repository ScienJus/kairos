name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make go-test
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: make release-notices
      - uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          syft-version: v1.33.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish
      - name: Generate backend SBOM
        run: |
          mapfile -t server_binaries < <(find dist -type f -name kairos-server -print | sort)
          test "${#server_binaries[@]}" -eq 4
          for server_binary in "${server_binaries[@]}"; do
            syft "${server_binary}" --output cyclonedx-json="$(dirname "${server_binary}")/kairos-server.sbom.cdx.json"
          done
      - name: Generate frontend SBOM
        working-directory: web
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application \
            | jq '.metadata.component.name = "kairos-console"' \
            > ../dist/kairos-console.sbom.cdx.json
      - name: Merge release SBOM
        env:
          CYCLONEDX_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "${RUNNER_TEMP}/cyclonedx"
          echo "${CYCLONEDX_SHA256}  ${RUNNER_TEMP}/cyclonedx" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/cyclonedx"
          mapfile -t backend_sboms < <(find dist -type f -name kairos-server.sbom.cdx.json -print | sort)
          test "${#backend_sboms[@]}" -eq 4
          "${RUNNER_TEMP}/cyclonedx" merge \
            --input-files "${backend_sboms[@]}" dist/kairos-console.sbom.cdx.json \
            --output-file dist/kairos.sbom.cdx.json \
            --output-format json \
            --hierarchical \
            --group github.com/ScienJus \
            --name kairos \
            --version "${GITHUB_REF_NAME#v}"
          "${RUNNER_TEMP}/cyclonedx" validate --input-file dist/kairos.sbom.cdx.json
          rm "${backend_sboms[@]}" dist/kairos-console.sbom.cdx.json
          cd dist
          sha256sum kairos.sbom.cdx.json >> checksums.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/kairos.sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Attest release archives, SBOM, and checksums
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
            release-assets/kairos.sbom.cdx.json

  publish:
    name: Publish release assets
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
