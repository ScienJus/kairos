name: Release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .goreleaser.yaml
      - scripts/verify-release.py
      - scripts/test_verify_release.py
      - scripts/generate-third-party-notices.mjs
      - examples/**
      - docs/installation*.md
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.9
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make go-test
      - name: Test console asset verification
        run: python3 -B -m unittest discover -s scripts -p 'test_verify_release.py'
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: make release-notices
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          syft-version: v1.33.0
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean --skip=publish --snapshot=${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
      - name: Generate backend SBOM
        run: |
          mapfile -t backend_binaries < <(find dist -type f \( -name kairos-server -o -name kairos-daemon \) -print | sort)
          test "${#backend_binaries[@]}" -eq 8
          for backend_binary in "${backend_binaries[@]}"; do
            syft "${backend_binary}" --output cyclonedx-json="${backend_binary}.sbom.cdx.json"
          done
      - name: Generate frontend SBOM
        working-directory: web
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application \
            | jq '.metadata.component.name = "kairos-console"' \
            > ../dist/kairos-console.sbom.cdx.json
      - name: Merge release SBOM
        env:
          CYCLONEDX_SHA256: bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64 \
            --output "${RUNNER_TEMP}/cyclonedx"
          echo "${CYCLONEDX_SHA256}  ${RUNNER_TEMP}/cyclonedx" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/cyclonedx"
          mapfile -t backend_sboms < <(find dist -type f \( -name kairos-server.sbom.cdx.json -o -name kairos-daemon.sbom.cdx.json \) -print | sort)
          test "${#backend_sboms[@]}" -eq 8
          "${RUNNER_TEMP}/cyclonedx" merge \
            --input-files "${backend_sboms[@]}" dist/kairos-console.sbom.cdx.json \
            --output-file dist/kairos.sbom.cdx.json \
            --output-format json \
            --hierarchical \
            --group github.com/ScienJus \
            --name kairos \
            --version "$(jq -r '.version' dist/metadata.json)"
          "${RUNNER_TEMP}/cyclonedx" validate --input-file dist/kairos.sbom.cdx.json
          rm "${backend_sboms[@]}" dist/kairos-console.sbom.cdx.json
          cd dist
          sha256sum kairos.sbom.cdx.json >> checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/kairos.sbom.cdx.json
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify archive (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Smoke-test packaged binaries, console and example setup
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == push && "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            archive=$(basename release-assets/kairos_*_linux_amd64.tar.gz)
            version=${archive#kairos_}
            version=${version%_linux_amd64.tar.gz}
          fi
          python3 scripts/verify-release.py --assets release-assets --version "${version}"

  attest:
    name: Attest release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Attest release archives, SBOM, and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2.4.2.2.4.2.2
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/checksums.txt
            release-assets/kairos.sbom.cdx.json

  publish:
    name: Publish release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_flags=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}" \
            "${release_flags[@]}"
